name: Weekly portfolio update

on:
  schedule:
    # Monday 8:00am Melbourne (AEDT, UTC+11) = Sunday 21:00 UTC.
    # From April to October (AEST, UTC+10) this runs at 7:00am instead.
    - cron: "0 21 * * 0"
  workflow_dispatch: {}   # lets you click "Run workflow" by hand
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # 1) REAL data -> private weekly email only (never published)
  email:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: "Step A: build report from your real holdings"
        env:
          HOLDINGS_KEY: ${{ secrets.HOLDINGS_KEY }}
          HOLDINGS_CSV: ${{ secrets.HOLDINGS_CSV }}
        run: |
          if [ -n "$HOLDINGS_KEY" ] && [ -f holdings.csv.age ]; then
            echo "Using the locked holdings file (holdings.csv.age)"
            python scripts/unlock_holdings.py
          elif [ -n "$HOLDINGS_CSV" ]; then
            echo "::warning::Using the HOLDINGS_CSV secret (old method). Add HOLDINGS_KEY to use the locked file."
            printf '%s\n' "$HOLDINGS_CSV" > holdings.csv
          fi
          if [ -f holdings.csv ]; then
            echo "Holdings rows: $(($(wc -l < holdings.csv) - 1))"
            python scripts/update.py --holdings holdings.csv
            rm holdings.csv
          else
            echo "::warning::No holdings found - using demo data"
            python scripts/update.py --demo
          fi

      - name: "Step B: send the email"
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/send_email.py

  # 2) DEMO data -> public GitHub Pages site (runs even if the email job fails)
  site:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build public demo site
        run: |
          python scripts/update.py --demo
          python scripts/static_render.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
